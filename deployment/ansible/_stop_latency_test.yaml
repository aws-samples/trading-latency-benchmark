# Documented in README but not called by the e2e test; its kill-grep only matches java, missing the hft_client pattern used elsewhere, so it silently 
# fails to stop Rust/C++ clients

---
- name: stop exchange clients
  hosts: aws_ec2
  collections:
    - amazon.aws.ec2_instance
  tasks:
    - name: stop exchange client
      become: true
      become_user: root
      shell: |
        ps -aux | grep "java" | grep -v "grep" | awk '{print $2}' | while read -r pid ; do
          echo "Shutting down PID: $pid"
          kill -9 $pid
        done
    - name: stop exchange server
      become: true
      become_user: root
      shell: |
        ps -aux | grep "mock-trading-server" | grep -v "grep" | awk '{print $2}' | while read -r pid ; do
          echo "Shutting down PID: $pid"
          kill -9 $pid
        done
