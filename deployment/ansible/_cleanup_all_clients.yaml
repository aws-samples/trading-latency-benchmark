---

# Zero references anywhere; targets stale flat file paths (histogram.hlog, output.log) that don't match current nested-path conventions used by  
# fetch_histogram_logs.yaml/run_hunting_benchmark.yaml


- name: cleanup exchange clients
  hosts: aws_ec2
  collections:
    - amazon.aws.ec2_instance
  tasks:
    - name: cleanup exchange client
      become: true
      become_user: root
      shell: |
        rm /home/ec2-user/histogram.hlog
        rm /home/ec2-user/config.properties.*
        echo "" > output.log
