plugin: amazon.aws.aws_ec2

# Dynamic inventory from EC2 tags set by FleetStack.
# Discovers both the primary (us-east-1) and secondary (eu-west-2) regions so a
# single run covers cross-region topologies. Single-region runs just get an
# empty result from the other region (harmless).
regions:
  - us-east-1
  - eu-west-2

include_filters:
  - tag:Role:
      - source
      - replicator
      - destination

hostnames:
  - ip-address

compose:
  ansible_host: public_ip_address
  ansible_user: "'ec2-user'"
  # Per-region key: eu-west-2 nodes use SSH_KEY_FILE_SECONDARY (e.g. london.pem),
  # everything else uses SSH_KEY_FILE (e.g. virginia.pem). Selected by AZ prefix
  # so single-region runs (only SSH_KEY_FILE set) keep working unchanged.
  ansible_ssh_private_key_file: "('eu-west-2' in placement.availability_zone) | ternary(lookup('env', 'SSH_KEY_FILE_SECONDARY'), lookup('env', 'SSH_KEY_FILE'))"

groups:
  source:       "tags.Role == 'source'"
  replicator:   "tags.Role == 'replicator'"
  destination:  "tags.Role == 'destination'"