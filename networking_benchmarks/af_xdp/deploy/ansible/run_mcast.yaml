---
# Run multicast fan-out latency benchmark.
#
# Topology: source sends m2u-tagged unicast → replicator fans out → destinations measure.
# Requires configure_mcast.yaml to have been run first (adapts source/dest nodes,
# adapts roles + destination registration).
#
# Usage:
#   ansible-playbook -i inventory.aws_ec2.yml run_mcast.yaml \
#     -e replicator_private_ip=10.61.0.5
#   ansible-playbook -i inventory.aws_ec2.yml run_mcast.yaml \
#     -e replicator_private_ip=10.61.0.5 -e count=10000 -e interval_us=100
#
# Results saved to: af_xdp/results/<timestamp>/
#   <src_ip>-<dst_ip>.json          — per-pair one-way latency (service_rtt_us schema)
#   <hostname>_mcast.log            — receiver stdout (human-readable stats)
#   <ip>_metadata.json              — node info
#   fleet.json / matrix_report.html — web-viewer topology + heatmap

- name: Setup — compute one stable results dir for the whole run
  hosts: localhost
  become: false
  gather_facts: true
  tasks:
    - name: Compute results_dir (once)
      ansible.builtin.set_fact:
        # Mirror run_ucast's naming (results/<date>/<hh-mm-ss>), suffixed -mcast.
        results_dir: "{{ playbook_dir }}/../../results/{{ ansible_date_time.date }}/{{ ansible_date_time.hour }}-{{ ansible_date_time.minute }}-{{ ansible_date_time.second }}-mcast"
    - name: Create results directory
      ansible.builtin.file:
        path: "{{ results_dir }}"
        state: directory

- name: Multicast fan-out latency benchmark
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    count: "1000"
    interval_us: "1000"
    data_port: "5000"
    mcast_group: "224.0.31.50"
    timeout_sec: "60"
    max_clock_offset_us: 10
    allow_unsynced: false
    results_dir: "{{ hostvars['localhost'].results_dir }}"

  tasks:

    - name: Validate replicator_private_ip
      ansible.builtin.assert:
        that: replicator_private_ip is defined
        fail_msg: "replicator_private_ip required (-e replicator_private_ip=x.x.x.x)"
      run_once: true

    - name: Create results directory
      ansible.builtin.file:
        path: "{{ results_dir }}"
        state: directory
      delegate_to: localhost
      become: false
      run_once: true

    # ── Reproducibility: free the AF_XDP queue on the transient app nodes ──
    # A prior run's mcast_send/mcast_receive (or a stale XDP program) can hold
    # queue 0; with RSS collapsed to queue 0 a stuck receiver ALSO starves SSH
    # (it owns all RX). Kill leftovers + detach XDP on source/destination BEFORE
    # each run so the benchmark is repeatable at will. NOT on the replicator —
    # its mcast.o fan-out program must stay attached.
    - name: Pre-run cleanup — free AF_XDP queue (source/destination only)
      ansible.builtin.shell: |
        pkill -9 -x mcast_receive 2>/dev/null || true
        pkill -9 -x mcast_send    2>/dev/null || true
        sleep 1
        IFACE=$(ip -4 route show default | awk '{print $5}' | head -1)
        ip link set "$IFACE" xdp off        2>/dev/null || true
        ip link set "$IFACE" xdpgeneric off 2>/dev/null || true
        ip link set "$IFACE" xdpdrv off     2>/dev/null || true
        xdp-loader unload "$IFACE" --all     2>/dev/null || true
      when: "'source' in group_names or 'destination' in group_names"
      changed_when: false

    # ── Reproducibility: force deterministic clock convergence per run ──
    # One-way latency = rx(dest CLOCK_REALTIME) - tx(source CLOCK_REALTIME). A
    # drifted or freshly-rebooted node whose clock lags the source produces
    # rx<tx, which the receiver clamps to 0 (looks like "no data"). makestep +
    # burst re-converges here so the run is valid on its own — no dependency on
    # configure_mcast having just run, and no need for the allow_unsynced bypass
    # (which silently yields the clamped-to-0 garbage).
    - name: Force clock convergence (makestep + burst)
      ansible.builtin.shell: |
        chronyc makestep >/dev/null 2>&1 || true
        chronyc burst 3/4 >/dev/null 2>&1 || true
        for i in $(seq 1 10); do
          chronyc tracking 2>/dev/null | grep -q "Leap status *: *Normal" && break
          sleep 1
        done
      changed_when: false

    - name: Measure clock offset (us)
      ansible.builtin.shell: |
        t=$(chronyc tracking 2>/dev/null)
        last=$(printf '%s\n' "$t" | awk -F': *' '/Last offset/{print $2}' | awk '{print $1}')
        awk -v l="$last" 'BEGIN{a=(l<0)?-l:l; printf "%.3f", a*1e6}'
      register: clock_offset_us
      changed_when: false

    - name: Gate on clock offset (hard-fail unless allow_unsynced)
      ansible.builtin.assert:
        that: (clock_offset_us.stdout | float) <= (max_clock_offset_us | float)
        fail_msg: >-
          {{ inventory_hostname }} clock offset {{ clock_offset_us.stdout }}us exceeds
          {{ max_clock_offset_us }}us — one-way latency would be invalid. Re-run
          configure_mcast, or bypass with -e allow_unsynced=true.
      when: not (allow_unsynced | default(false) | bool)

    # ── Pin ENA IRQs off CPU0 to the first isolated CPU + stop irqbalance ──
    # Hard IRQs default to CPU0 (shared with OS/SSH); moving them to a dedicated
    # isolated core removes the P99 jitter that leaks into hop latency. Runs on
    # all roles (source/replicator/dest all carry the datapath NIC).
    - name: Pin ENA IRQs to an isolated CPU + disable irqbalance
      ansible.builtin.shell: |
        systemctl stop irqbalance 2>/dev/null || true
        systemctl disable irqbalance 2>/dev/null || true
        ISOL=$(cat /sys/devices/system/cpu/isolated 2>/dev/null)
        [ -z "$ISOL" ] && exit 0
        CPU=${ISOL%%-*}                       # first isolated CPU (apps use CPU+1)
        IFACE=$(ip -4 route show default | awk '{print $5}' | head -1)
        # Low-latency NAPI: small gro_flush_timeout (10us) as a safety net for the
        # in-app busy-poll — NOT 0 (thrashes into multi-second bursts) and NOT the
        # baked 200us (adds ~200us/hop). 10us bounds the busy-poll gap window while
        # sitting above the NAPI/timer granularity. defer_hard_irqs lets busy-poll own NAPI.
        echo 2     > /sys/class/net/$IFACE/napi_defer_hard_irqs 2>/dev/null || true
        echo 10000 > /sys/class/net/$IFACE/gro_flush_timeout    2>/dev/null || true
        for irq in $(grep -iE "${IFACE}|ena" /proc/interrupts | awk -F: '{print $1}' | tr -d ' '); do
          echo "$CPU" > /proc/irq/$irq/smp_affinity_list 2>/dev/null || true
        done
        echo "ENA IRQs -> CPU $CPU; gro=20us defer=2"
      changed_when: false

    # ── Start receivers on destinations (AF_XDP, background) ───────────────
    - name: Start mcast_receive on destinations
      ansible.builtin.shell: |
        IFACE=$(ip -4 route show default | awk '{print $5}' | head -1)
        # Pin to an isolated CPU when present — the general scheduler may only
        # have CPU0 (shared with OS/IRQs), which starves the poll-based drain
        # loop and yields multi-second bursty latencies.
        ISOL=$(cat /sys/devices/system/cpu/isolated 2>/dev/null)
        # Apps run on (first isolated CPU + 1). The ENA hard IRQ is pinned to the
        # first isolated CPU (see the IRQ-affinity task), so the busy-poll thread
        # sits on a different core and is never preempted by the hard IRQ.
        PIN=""; [ -n "$ISOL" ] && { F=${ISOL%%-*}; PIN="taskset -c $((F+1))"; }
        nohup $PIN /opt/af-xdp/mcast_receive \
          -I "$IFACE" \
          -g {{ mcast_group }} \
          -p {{ data_port }} \
          -c {{ count }} \
          -t {{ timeout_sec }} \
          -j /tmp/mcast_results.json \
          > /tmp/mcast_receive.log 2>&1 &
        echo $!
      register: receiver_pid
      when: "'destination' in group_names"

    # ── Pin the replicator fan-out to an isolated CPU (avoid CPU0 starvation) ─
    - name: Pin replicator process to an isolated CPU
      ansible.builtin.shell: |
        ISOL=$(cat /sys/devices/system/cpu/isolated 2>/dev/null)
        [ -z "$ISOL" ] && exit 0
        F=${ISOL%%-*}; CPU=$((F+1))
        for pid in $(pgrep -x replicator); do
          for t in $(ls /proc/$pid/task 2>/dev/null); do taskset -pc "$CPU" "$t" >/dev/null 2>&1 || true; done
        done
        echo "pinned replicator to CPU $CPU"
      when: "'replicator' in group_names"
      changed_when: false

    # ── Wait for XDP attach on destinations ────────────────────────────────
    - name: Wait for receivers to attach XDP
      ansible.builtin.pause:
        seconds: 3
      run_once: true

    # ── Send from source (m2u unicast to replicator) ──────────────────
    - name: Run mcast_send from source
      ansible.builtin.shell: |
        IFACE=$(ip -4 route show default | awk '{print $5}' | head -1)
        ISOL=$(cat /sys/devices/system/cpu/isolated 2>/dev/null)
        # Apps run on (first isolated CPU + 1). The ENA hard IRQ is pinned to the
        # first isolated CPU (see the IRQ-affinity task), so the busy-poll thread
        # sits on a different core and is never preempted by the hard IRQ.
        PIN=""; [ -n "$ISOL" ] && { F=${ISOL%%-*}; PIN="taskset -c $((F+1))"; }
        $PIN /opt/af-xdp/mcast_send \
          -I "$IFACE" \
          -D {{ replicator_private_ip }} \
          -g {{ mcast_group }} \
          -p {{ data_port }} \
          -c {{ count }} \
          -i {{ interval_us }}
      when: "'source' in group_names"

    # ── Wait for receivers to finish ───────────────────────────────────────
    - name: Wait for receivers to complete
      ansible.builtin.shell: |
        # Wait for background mcast_receive to exit (or timeout)
        for i in $(seq 1 {{ timeout_sec }}); do
          pgrep -f mcast_receive > /dev/null || break
          sleep 1
        done
      when: "'destination' in group_names"

    # ── Collect results ────────────────────────────────────────────────────
    - name: Fetch receiver output
      ansible.builtin.fetch:
        src: /tmp/mcast_receive.log
        dest: "{{ results_dir }}/{{ inventory_hostname }}_mcast.log"
        flat: yes
      when: "'destination' in group_names"

    - name: Fetch receiver JSON (per-pair, <src_ip>-<dst_ip>.json for the report)
      ansible.builtin.fetch:
        src: /tmp/mcast_results.json
        dest: "{{ results_dir }}/{{ hostvars[groups['source'][0]].private_ip_address }}-{{ private_ip_address }}.json"
        flat: yes
      when: "'destination' in group_names and (groups['source'] | default([]) | length > 0)"

    # ── Reproducibility: release the AF_XDP queue after the run ────────────
    # Results are already fetched; free queue 0 + detach XDP on the destination so
    # the next invocation (or SSH) is never blocked by a lingering receiver.
    - name: Post-run cleanup — release AF_XDP queue on destination
      ansible.builtin.shell: |
        pkill -9 -x mcast_receive 2>/dev/null || true
        sleep 1
        IFACE=$(ip -4 route show default | awk '{print $5}' | head -1)
        ip link set "$IFACE" xdp off 2>/dev/null || true
        xdp-loader unload "$IFACE" --all 2>/dev/null || true
      when: "'destination' in group_names"
      changed_when: false

    # ── Metadata ───────────────────────────────────────────────────────────
    - name: Collect node metadata
      ansible.builtin.copy:
        content: |
          {{ {
            "hostname": inventory_hostname,
            "private_ip": private_ip_address | default(ansible_host),
            "role": group_names | intersect(['source','replicator','destination']) | first | default('unknown'),
            "instance_type": tags.InstanceType | default('unknown'),
            "az": placement.availability_zone | default('unknown'),
            "region": tags.Region | default(region | default('unknown')),
            "pg_type": tags.PlacementStrategy | default(None),
            "pg_name": tags.PlacementGroup | default(None),
            "clock_offset_us": clock_offset_us.stdout | default("unknown")
          } | to_nice_json }}
        dest: "/tmp/node_metadata.json"

    - name: Fetch metadata
      ansible.builtin.fetch:
        src: /tmp/node_metadata.json
        dest: "{{ results_dir }}/{{ private_ip_address }}_metadata.json"
        flat: yes

    - name: Display results location
      ansible.builtin.debug:
        msg: "Results saved to {{ results_dir }}/"
      run_once: true


# ── Generate report (local) — heatmap + fleet.json for the web viewer ─────────
# Mirrors run_ucast.yaml Play 4: the per-pair <src_ip>-<dst_ip>.json files (one-way
# source->destination latency in the service_rtt_us schema) + <ip>_metadata.json
# feed the same gen scripts, so the web app (report/web) renders mcast identically.
- name: Generate report
  hosts: localhost
  become: false
  gather_facts: false

  tasks:
    - name: Use the run's results dir
      ansible.builtin.set_fact:
        latest_dir: "{{ hostvars['localhost'].results_dir }}"

    - name: Run report generator (heatmap + fleet.json)
      ansible.builtin.shell: |
        python3 {{ playbook_dir }}/../../report/gen/report.py {{ latest_dir }}
        python3 {{ playbook_dir }}/../../report/gen/fleet_json.py {{ latest_dir }}
      register: report_output
      changed_when: true

    - name: Display report
      ansible.builtin.debug:
        msg: "{{ report_output.stdout_lines | default(['No output']) }}"

    - name: Show errors (if any)
      ansible.builtin.debug:
        msg: "{{ report_output.stderr_lines }}"
      when: report_output.rc != 0

    - name: Report artifacts
      ansible.builtin.debug:
        msg: >-
          Wrote matrix_report.html, fleet.json, matrix_summary.json to
          {{ latest_dir }} — view fleet.json in report/web (2D/3D)
      when: report_output.rc == 0
