plugin: amazon.aws.aws_ec2

# Secondary-region inventory for cross-region topologies.
# Only used when AWS_SECONDARY_REGION is set.
#
# Usage (combined with primary):
#   AWS_DEFAULT_REGION=us-east-1 AWS_SECONDARY_REGION=eu-west-2 \
#     ansible-playbook -i inventory.aws_ec2.yml -i inventory_secondary.aws_ec2.yml ...
regions:
  - "{{ lookup('env', 'AWS_SECONDARY_REGION') | default('_none_', true) }}"

include_filters:
  - tag:Role:
      - source
      - replicator
      - destination

hostnames:
  - ip-address

compose:
  ansible_host: public_ip_address
  ansible_user: "'ec2-user'"
  ansible_ssh_private_key_file: "{{ lookup('env', 'SSH_KEY_FILE_SECONDARY') | default(lookup('env', 'SSH_KEY_FILE'), true) }}"

groups:
  source:       "tags.Role == 'source'"
  replicator:   "tags.Role == 'replicator'"
  destination:  "tags.Role == 'destination'"
