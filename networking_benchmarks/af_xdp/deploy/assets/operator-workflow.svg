<?xml version="1.0" encoding="UTF-8"?>
<!--
  AF_XDP Benchmark — Operator Workflow
  Shows the end-to-end flow: bake AMI → deploy fleet → sync/test → run benchmarks → report
  SPDX-License-Identifier: MIT-0
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="Inter, -apple-system, sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="480" fill="#fafbfc" rx="8"/>

  <!-- Title -->
  <text x="430" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">AF_XDP Benchmark — Operator Workflow</text>

  <!-- ═══ Step 1: Bake AMI ═══ -->
  <rect x="30" y="55" width="170" height="100" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="115" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#9a3412">① Bake AMI</text>
  <text x="115" y="92" text-anchor="middle" font-size="8" fill="#78716c" font-family="monospace">cdk deploy</text>
  <text x="115" y="104" text-anchor="middle" font-size="8" fill="#78716c" font-family="monospace">  --context</text>
  <text x="115" y="116" text-anchor="middle" font-size="8" fill="#78716c" font-family="monospace">  deploymentType=</text>
  <text x="115" y="128" text-anchor="middle" font-size="8" fill="#78716c" font-family="monospace">  ami-builder</text>
  <text x="115" y="145" text-anchor="middle" font-size="9" fill="#6b7280">~9 min, one-time</text>

  <!-- Arrow 1→2 -->
  <line x1="200" y1="105" x2="230" y2="105" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- ═══ Step 2: Deploy Control Plane ═══ -->
  <rect x="235" y="55" width="170" height="100" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="320" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">② Control Plane</text>
  <text x="320" y="92" text-anchor="middle" font-size="8" fill="#64748b" font-family="monospace">cdk deploy</text>
  <text x="320" y="104" text-anchor="middle" font-size="8" fill="#64748b" font-family="monospace">  --context</text>
  <text x="320" y="116" text-anchor="middle" font-size="8" fill="#64748b" font-family="monospace">  deploymentType=</text>
  <text x="320" y="128" text-anchor="middle" font-size="8" fill="#64748b" font-family="monospace">  control-plane</text>
  <text x="320" y="145" text-anchor="middle" font-size="9" fill="#6b7280">NATS + web + API</text>

  <!-- Arrow 2→3 -->
  <line x1="405" y1="105" x2="435" y2="105" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- ═══ Step 3: Deploy Fleet ═══ -->
  <rect x="440" y="55" width="170" height="100" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="525" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">③ Deploy Fleet</text>
  <text x="525" y="92" text-anchor="middle" font-size="8" fill="#64748b" font-family="monospace">cdk deploy</text>
  <text x="525" y="104" text-anchor="middle" font-size="8" fill="#64748b" font-family="monospace">  --context</text>
  <text x="525" y="116" text-anchor="middle" font-size="8" fill="#64748b" font-family="monospace">  scenario=</text>
  <text x="525" y="128" text-anchor="middle" font-size="8" fill="#64748b" font-family="monospace">  ucast/az-cpg-3</text>
  <text x="525" y="145" text-anchor="middle" font-size="9" fill="#6b7280">instant (baked AMI)</text>

  <!-- Arrow 3→4 -->
  <line x1="610" y1="105" x2="640" y2="105" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- ═══ Step 4: Run Benchmarks ═══ -->
  <rect x="645" y="55" width="170" height="100" rx="6" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="730" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#7e22ce">④ Run + Report</text>
  <text x="730" y="95" text-anchor="middle" font-size="8" fill="#6b21a8" font-family="monospace">afxdpctl run ucast</text>
  <text x="730" y="109" text-anchor="middle" font-size="8" fill="#6b21a8" font-family="monospace">afxdpctl report</text>
  <text x="730" y="125" text-anchor="middle" font-size="9" fill="#6b7280">— or —</text>
  <text x="730" y="139" text-anchor="middle" font-size="8" fill="#6b21a8" font-family="monospace">ansible-playbook</text>
  <text x="730" y="151" text-anchor="middle" font-size="8" fill="#6b21a8" font-family="monospace">  run_ucast.yaml</text>

  <!-- ═══ Dev iteration loop ═══ -->
  <rect x="30" y="200" width="800" height="130" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="430" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">DEV ITERATION LOOP (repeat after code changes)</text>

  <!-- Sync -->
  <rect x="60" y="238" width="170" height="75" rx="5" fill="#fff" stroke="#0891b2" stroke-width="1.2"/>
  <text x="145" y="258" text-anchor="middle" font-size="10" font-weight="bold" fill="#155e75">sync</text>
  <text x="145" y="275" text-anchor="middle" font-size="8" fill="#64748b" font-family="monospace">afxdpctl sync</text>
  <text x="145" y="289" text-anchor="middle" font-size="8" fill="#64748b">rsync → make → restart</text>
  <text x="145" y="303" text-anchor="middle" font-size="8" fill="#64748b">+ agent rebuild+enable</text>

  <!-- Arrow sync→test -->
  <line x1="230" y1="275" x2="270" y2="275" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Test -->
  <rect x="275" y="238" width="170" height="75" rx="5" fill="#fff" stroke="#0891b2" stroke-width="1.2"/>
  <text x="360" y="258" text-anchor="middle" font-size="10" font-weight="bold" fill="#155e75">run_tests</text>
  <text x="360" y="275" text-anchor="middle" font-size="8" fill="#64748b" font-family="monospace">ansible-playbook</text>
  <text x="360" y="289" text-anchor="middle" font-size="8" fill="#64748b" font-family="monospace">  run_tests.yaml</text>
  <text x="360" y="303" text-anchor="middle" font-size="8" fill="#64748b">pytest (echo mode)</text>

  <!-- Arrow test→run -->
  <line x1="445" y1="275" x2="485" y2="275" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Run benchmark -->
  <rect x="490" y="238" width="170" height="75" rx="5" fill="#fff" stroke="#0891b2" stroke-width="1.2"/>
  <text x="575" y="258" text-anchor="middle" font-size="10" font-weight="bold" fill="#155e75">run benchmark</text>
  <text x="575" y="275" text-anchor="middle" font-size="8" fill="#64748b" font-family="monospace">afxdpctl run ucast all</text>
  <text x="575" y="289" text-anchor="middle" font-size="8" fill="#64748b">— or —</text>
  <text x="575" y="303" text-anchor="middle" font-size="8" fill="#64748b" font-family="monospace">run_ucast.yaml</text>

  <!-- Arrow run→report -->
  <line x1="660" y1="275" x2="700" y2="275" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Report -->
  <rect x="705" y="238" width="110" height="75" rx="5" fill="#fff" stroke="#0891b2" stroke-width="1.2"/>
  <text x="760" y="258" text-anchor="middle" font-size="10" font-weight="bold" fill="#155e75">report</text>
  <text x="760" y="278" text-anchor="middle" font-size="8" fill="#64748b" font-family="monospace">afxdpctl report</text>
  <text x="760" y="293" text-anchor="middle" font-size="8" fill="#64748b">HTML heatmap</text>

  <!-- ═══ afxdpctl CLI box ═══ -->
  <rect x="30" y="365" width="800" height="100" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.2"/>
  <text x="430" y="385" text-anchor="middle" font-size="11" font-weight="bold" fill="#854d0e">afxdpctl — recommended single CLI entrypoint</text>

  <!-- Command table -->
  <text x="60" y="407" font-size="9" fill="#1f2937" font-family="monospace" font-weight="bold">up</text>
  <text x="120" y="407" font-size="9" fill="#4b5563">Deploy control-plane + (optionally) bake AMI + fleet</text>

  <text x="60" y="421" font-size="9" fill="#1f2937" font-family="monospace" font-weight="bold">sync</text>
  <text x="120" y="421" font-size="9" fill="#4b5563">Hot-deploy local code → all fleet nodes (rsync + make + agent)</text>

  <text x="60" y="435" font-size="9" fill="#1f2937" font-family="monospace" font-weight="bold">run</text>
  <text x="120" y="435" font-size="9" fill="#4b5563">Trigger ucast/mcast benchmark via control-plane API</text>

  <text x="60" y="449" font-size="9" fill="#1f2937" font-family="monospace" font-weight="bold">report</text>
  <text x="120" y="449" font-size="9" fill="#4b5563">Generate HTML report from collected edges</text>

  <text x="470" y="407" font-size="9" fill="#1f2937" font-family="monospace" font-weight="bold">fleet</text>
  <text x="530" y="407" font-size="9" fill="#4b5563">Show online nodes + edge summary</text>

  <text x="470" y="421" font-size="9" fill="#1f2937" font-family="monospace" font-weight="bold">cancel</text>
  <text x="530" y="421" font-size="9" fill="#4b5563">Abort the running measurement campaign</text>

  <text x="470" y="435" font-size="9" fill="#1f2937" font-family="monospace" font-weight="bold">down</text>
  <text x="530" y="435" font-size="9" fill="#4b5563">Destroy all stacks (fleet + CP + AMI builder)</text>
</svg>
