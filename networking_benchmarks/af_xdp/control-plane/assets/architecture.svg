<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#58a6ff"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#3fb950"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#f0883e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" rx="8" fill="#0d1117"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="700">AF_XDP Control Plane — Architecture</text>

  <!-- Fleet Nodes region -->
  <rect x="30" y="50" width="310" height="440" rx="6" fill="none" stroke="#30363d" stroke-dasharray="6,3"/>
  <text x="185" y="72" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="600">FLEET NODES (EC2 instances)</text>

  <!-- Agent 1 -->
  <rect x="50" y="90" width="270" height="100" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="185" y="112" text-anchor="middle" fill="#58a6ff" font-weight="700">Agent (source)</text>
  <text x="60" y="132" fill="#8b949e" font-size="10">• IMDS self-registration (instance-id, IP, AZ, PG, role)</text>
  <text x="60" y="148" fill="#8b949e" font-size="10">• Heartbeat every 5s (state, replicator mode, clock offset)</text>
  <text x="60" y="164" fill="#8b949e" font-size="10">• Executes: rtt, mcast_send, mcast_receive, set_mode …</text>
  <text x="60" y="180" fill="#8b949e" font-size="10">• Publishes Telemetry + CommandResult on completion</text>

  <!-- Agent 2 -->
  <rect x="50" y="200" width="270" height="70" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="185" y="222" text-anchor="middle" fill="#58a6ff" font-weight="700">Agent (replicator)</text>
  <text x="60" y="242" fill="#8b949e" font-size="10">• Same binary — role from IMDS tag or env AGENT_ROLE</text>
  <text x="60" y="258" fill="#8b949e" font-size="10">• Controls replicator.service mode (ucast/mcast)</text>

  <!-- Agent 3 -->
  <rect x="50" y="280" width="270" height="70" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="185" y="302" text-anchor="middle" fill="#58a6ff" font-weight="700">Agent (destination)</text>
  <text x="60" y="322" fill="#8b949e" font-size="10">• Joins mcast group via replicator_ctl</text>
  <text x="60" y="338" fill="#8b949e" font-size="10">• Runs mcast_receive, publishes one-way telemetry</text>

  <!-- Additional agents indicator -->
  <rect x="50" y="360" width="270" height="34" rx="6" fill="#161b22" stroke="#21262d" stroke-dasharray="4,2"/>
  <text x="185" y="382" text-anchor="middle" fill="#6e7681" font-size="11">… N agents (any mix of roles)</text>

  <!-- NATS bus -->
  <rect x="370" y="160" width="140" height="220" rx="8" fill="#1c2128" stroke="#f0883e" stroke-width="2"/>
  <text x="440" y="184" text-anchor="middle" fill="#f0883e" font-weight="700" font-size="13">NATS</text>
  <text x="440" y="202" text-anchor="middle" fill="#8b949e" font-size="10">Control Bus</text>
  <text x="380" y="225" fill="#6e7681" font-size="9">fleet.register</text>
  <text x="380" y="240" fill="#6e7681" font-size="9">fleet.heartbeat</text>
  <text x="380" y="255" fill="#6e7681" font-size="9">fleet.telemetry</text>
  <text x="380" y="270" fill="#6e7681" font-size="9">fleet.cmd.agent.{id}</text>
  <text x="380" y="285" fill="#6e7681" font-size="9">fleet.cmd.role.{role}</text>
  <text x="380" y="300" fill="#6e7681" font-size="9">fleet.cmd.all</text>
  <text x="380" y="315" fill="#6e7681" font-size="9">fleet.result.{id}</text>
  <text x="380" y="340" fill="#8b949e" font-size="9">Token auth + optional TLS</text>
  <text x="380" y="355" fill="#8b949e" font-size="9">All outbound from agents</text>
  <text x="380" y="370" fill="#8b949e" font-size="9">No inbound ports on fleet</text>

  <!-- Arrows agent -> NATS -->
  <line x1="320" y1="140" x2="370" y2="200" stroke="#3fb950" marker-end="url(#arr-green)"/>
  <line x1="320" y1="235" x2="370" y2="250" stroke="#3fb950" marker-end="url(#arr-green)"/>
  <line x1="320" y1="315" x2="370" y2="290" stroke="#3fb950" marker-end="url(#arr-green)"/>

  <!-- Backend -->
  <rect x="550" y="80" width="320" height="310" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="710" y="104" text-anchor="middle" fill="#58a6ff" font-weight="700" font-size="14">Backend (Go)</text>
  <text x="710" y="120" text-anchor="middle" fill="#6e7681" font-size="10">dedicated EC2 alongside nats-server</text>

  <!-- Backend sub-components -->
  <rect x="565" y="132" width="135" height="34" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="632" y="154" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="600">Registry</text>

  <rect x="720" y="132" width="135" height="34" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="787" y="154" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="600">Collector (NxN)</text>

  <rect x="565" y="176" width="135" height="34" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="632" y="198" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="600">Orchestrator</text>

  <rect x="720" y="176" width="135" height="34" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="787" y="198" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="600">Hub (SSE fan-out)</text>

  <rect x="565" y="220" width="290" height="34" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="710" y="242" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="600">Ingest (NATS subscriptions → registry/collector/hub)</text>

  <rect x="565" y="264" width="290" height="60" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="710" y="282" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="600">HTTP + SSE API</text>
  <text x="575" y="298" fill="#8b949e" font-size="10">GET /api/fleet  GET /api/events (SSE)</text>
  <text x="575" y="312" fill="#8b949e" font-size="10">POST /api/run  POST /api/cancel  POST /api/cmd</text>

  <rect x="565" y="334" width="290" height="42" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="710" y="352" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="600">Static file server (web/dist)</text>
  <text x="710" y="368" text-anchor="middle" fill="#8b949e" font-size="10">Svelte + three.js topology viewer</text>

  <!-- Arrow NATS -> Backend -->
  <line x1="510" y1="230" x2="560" y2="230" stroke="#f0883e" stroke-width="2" marker-end="url(#arr-orange)"/>
  <!-- Arrow Backend -> NATS (commands) -->
  <line x1="560" y1="195" x2="510" y2="270" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Browser / Web UI -->
  <rect x="570" y="410" width="280" height="80" rx="6" fill="#1c2128" stroke="#a371f7" stroke-width="2"/>
  <text x="710" y="434" text-anchor="middle" fill="#a371f7" font-weight="700" font-size="13">Web Browser</text>
  <text x="580" y="454" fill="#8b949e" font-size="10">• SSE stream (EventSource /api/events)</text>
  <text x="580" y="470" fill="#8b949e" font-size="10">• POST /api/run, /api/cancel</text>
  <text x="580" y="486" fill="#8b949e" font-size="10">• Client-side HTML report download</text>

  <!-- Arrow Backend <-> Browser -->
  <line x1="710" y1="390" x2="710" y2="408" stroke="#a371f7" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- afxdpctl CLI -->
  <rect x="50" y="420" width="270" height="60" rx="6" fill="#1c2128" stroke="#f0883e"/>
  <text x="185" y="444" text-anchor="middle" fill="#f0883e" font-weight="700">afxdpctl CLI</text>
  <text x="60" y="464" fill="#8b949e" font-size="10">fleet | run | cancel | report | up | sync | down</text>
  <text x="60" y="478" fill="#8b949e" font-size="10">Same HTTP API as the web UI (default localhost:8080)</text>

  <!-- Arrow CLI -> Backend API -->
  <path d="M320,450 C430,450 430,340 560,320" fill="none" stroke="#f0883e" stroke-dasharray="4,3" marker-end="url(#arr-orange)"/>
</svg>
