<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 880" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11">
  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="#58a6ff"/>
    </marker>
    <marker id="ag" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="#3fb950"/>
    </marker>
    <marker id="ao" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="#f0883e"/>
    </marker>
    <marker id="ap" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="#a371f7"/>
    </marker>
  </defs>

  <rect width="1020" height="880" rx="8" fill="#0d1117"/>
  <text x="510" y="26" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">Run-a-Test Sequence — unicast NxN campaign (user clicks "kernel")</text>

  <!-- Lifelines -->
  <rect x="70" y="44" width="80" height="28" rx="4" fill="#1c2128" stroke="#a371f7"/>
  <text x="110" y="63" text-anchor="middle" fill="#a371f7" font-weight="700">Browser</text>
  <line x1="110" y1="72" x2="110" y2="860" stroke="#30363d" stroke-dasharray="4,2"/>

  <rect x="230" y="44" width="100" height="28" rx="4" fill="#1c2128" stroke="#58a6ff"/>
  <text x="280" y="63" text-anchor="middle" fill="#58a6ff" font-weight="700">Backend API</text>
  <line x1="280" y1="72" x2="280" y2="860" stroke="#30363d" stroke-dasharray="4,2"/>

  <rect x="400" y="44" width="100" height="28" rx="4" fill="#1c2128" stroke="#58a6ff"/>
  <text x="450" y="63" text-anchor="middle" fill="#58a6ff" font-weight="700">Orchestrator</text>
  <line x1="450" y1="72" x2="450" y2="860" stroke="#30363d" stroke-dasharray="4,2"/>

  <rect x="570" y="44" width="80" height="28" rx="4" fill="#1c2128" stroke="#f0883e"/>
  <text x="610" y="63" text-anchor="middle" fill="#f0883e" font-weight="700">NATS</text>
  <line x1="610" y1="72" x2="610" y2="860" stroke="#30363d" stroke-dasharray="4,2"/>

  <rect x="730" y="44" width="100" height="28" rx="4" fill="#1c2128" stroke="#3fb950"/>
  <text x="780" y="63" text-anchor="middle" fill="#3fb950" font-weight="700">Agent (src)</text>
  <line x1="780" y1="72" x2="780" y2="860" stroke="#30363d" stroke-dasharray="4,2"/>

  <rect x="890" y="44" width="100" height="28" rx="4" fill="#1c2128" stroke="#3fb950"/>
  <text x="940" y="63" text-anchor="middle" fill="#3fb950" font-weight="700">Agent (dst)</text>
  <line x1="940" y1="72" x2="940" y2="860" stroke="#30363d" stroke-dasharray="4,2"/>

  <!-- Step 1: POST /api/run -->
  <line x1="112" y1="100" x2="275" y2="100" stroke="#a371f7" marker-end="url(#ap)"/>
  <text x="193" y="95" text-anchor="middle" fill="#a371f7" font-size="10" font-weight="600">POST /api/run {kind:ucast, variation:kernel}</text>

  <!-- Step 2: 202 Accepted -->
  <line x1="275" y1="118" x2="112" y2="118" stroke="#a371f7" stroke-dasharray="4,2" marker-end="url(#ap)"/>
  <text x="193" y="113" text-anchor="middle" fill="#8b949e" font-size="9">202 Accepted (async)</text>

  <!-- Step 3: Goroutine launch -->
  <line x1="282" y1="136" x2="445" y2="136" stroke="#58a6ff" marker-end="url(#a)"/>
  <text x="363" y="131" text-anchor="middle" fill="#58a6ff" font-size="10">go RunUcastMatrix(params)</text>

  <!-- Step 4: CAS guard -->
  <rect x="395" y="148" width="110" height="18" rx="3" fill="#161b22" stroke="#30363d"/>
  <text x="450" y="161" text-anchor="middle" fill="#8b949e" font-size="9">CAS: running 0→1</text>

  <!-- Step 5: SSE job running -->
  <line x1="448" y1="180" x2="282" y2="180" stroke="#58a6ff" stroke-dasharray="3,2" marker-end="url(#a)"/>
  <text x="365" y="175" text-anchor="middle" fill="#6e7681" font-size="9">hub.Emit("job", {status:"running"…})</text>
  <line x1="278" y1="192" x2="112" y2="192" stroke="#a371f7" stroke-dasharray="3,2" marker-end="url(#ap)"/>
  <text x="195" y="188" text-anchor="middle" fill="#6e7681" font-size="9">SSE: job delta</text>

  <!-- Step 6: Prepare phase — set echo mode (skipped if already set) -->
  <rect x="370" y="208" width="160" height="16" rx="3" fill="#21262d" stroke="none"/>
  <text x="450" y="220" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="600">PREPARE: set nodes to ucast echo</text>

  <line x1="452" y1="234" x2="607" y2="234" stroke="#58a6ff" marker-end="url(#a)"/>
  <text x="530" y="229" text-anchor="middle" fill="#58a6ff" font-size="9">pub fleet.cmd.agent.{dst} CmdSetMode "ucast"</text>
  <line x1="612" y1="242" x2="935" y2="242" stroke="#f0883e" marker-end="url(#ao)"/>
  <text x="770" y="238" text-anchor="middle" fill="#f0883e" font-size="9">NATS delivers to agent subscription</text>

  <rect x="900" y="248" width="80" height="16" rx="3" fill="#161b22" stroke="#30363d"/>
  <text x="940" y="260" text-anchor="middle" fill="#8b949e" font-size="9">SetMode("ucast")</text>

  <line x1="935" y1="270" x2="612" y2="270" stroke="#3fb950" marker-end="url(#ag)"/>
  <text x="770" y="266" text-anchor="middle" fill="#3fb950" font-size="9">pub fleet.result.{dst} CommandResult{OK:true}</text>
  <line x1="608" y1="278" x2="452" y2="278" stroke="#f0883e" marker-end="url(#ao)"/>
  <text x="530" y="274" text-anchor="middle" fill="#6e7681" font-size="9">correlated by CmdID</text>

  <!-- Step 7: SSE progress (prepare) -->
  <line x1="448" y1="296" x2="282" y2="296" stroke="#58a6ff" stroke-dasharray="3,2" marker-end="url(#a)"/>
  <text x="365" y="291" text-anchor="middle" fill="#6e7681" font-size="9">hub.Emit("job", {phase:"prepare"})</text>
  <line x1="278" y1="304" x2="112" y2="304" stroke="#a371f7" stroke-dasharray="3,2" marker-end="url(#ap)"/>
  <text x="195" y="300" text-anchor="middle" fill="#6e7681" font-size="9">SSE → web re-render (debounced 500ms)</text>

  <!-- Step 8: Round scheduling -->
  <rect x="370" y="320" width="160" height="16" rx="3" fill="#21262d" stroke="none"/>
  <text x="450" y="332" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="600">ROUND 1 of ~2(N-1): node-disjoint pairs</text>

  <!-- Step 9: Dispatch RTT to source agent -->
  <line x1="452" y1="350" x2="607" y2="350" stroke="#58a6ff" marker-end="url(#a)"/>
  <text x="530" y="345" text-anchor="middle" fill="#58a6ff" font-size="9">pub fleet.cmd.agent.{src} CmdRunRTT{target=dst.IP}</text>
  <line x1="612" y1="358" x2="775" y2="358" stroke="#f0883e" marker-end="url(#ao)"/>

  <!-- Step 10: Agent runs rtt binary -->
  <rect x="735" y="368" width="90" height="36" rx="3" fill="#161b22" stroke="#3fb950"/>
  <text x="780" y="382" text-anchor="middle" fill="#3fb950" font-size="9">$ rtt dst_ip 5000</text>
  <text x="780" y="396" text-anchor="middle" fill="#8b949e" font-size="8">(C++ tool, pinned CPU)</text>

  <!-- Step 11: Measurement traffic (src <-> dst echo) -->
  <line x1="782" y1="410" x2="935" y2="410" stroke="#6e7681" stroke-dasharray="2,2" marker-end="url(#a)"/>
  <text x="860" y="406" text-anchor="middle" fill="#6e7681" font-size="8">UDP echo (data plane)</text>
  <line x1="935" y1="418" x2="782" y2="418" stroke="#6e7681" stroke-dasharray="2,2" marker-end="url(#a)"/>

  <!-- Step 12: Agent publishes telemetry + result -->
  <line x1="775" y1="440" x2="612" y2="440" stroke="#3fb950" marker-end="url(#ag)"/>
  <text x="693" y="436" text-anchor="middle" fill="#3fb950" font-size="9">pub fleet.telemetry (Telemetry{metrics})</text>
  <line x1="775" y1="456" x2="612" y2="456" stroke="#3fb950" marker-end="url(#ag)"/>
  <text x="693" y="452" text-anchor="middle" fill="#3fb950" font-size="9">pub fleet.result.{src} (CommandResult{OK})</text>

  <!-- Step 13: Ingest processes -->
  <line x1="608" y1="468" x2="452" y2="468" stroke="#f0883e" marker-end="url(#ao)"/>
  <text x="530" y="464" text-anchor="middle" fill="#6e7681" font-size="9">ingest: telemetry→collector.Apply()</text>
  <line x1="608" y1="482" x2="452" y2="482" stroke="#f0883e" marker-end="url(#ao)"/>
  <text x="530" y="478" text-anchor="middle" fill="#6e7681" font-size="9">ingest: result→orchestrator pending ch</text>

  <!-- Step 14: Hub emits edge delta -->
  <line x1="448" y1="500" x2="282" y2="500" stroke="#58a6ff" stroke-dasharray="3,2" marker-end="url(#a)"/>
  <text x="365" y="496" text-anchor="middle" fill="#6e7681" font-size="9">hub.Emit("edge", updated edge)</text>
  <line x1="278" y1="510" x2="112" y2="510" stroke="#a371f7" stroke-dasharray="3,2" marker-end="url(#ap)"/>
  <text x="195" y="506" text-anchor="middle" fill="#6e7681" font-size="9">SSE: edge delta</text>

  <!-- Step 15: Browser update -->
  <rect x="60" y="520" width="100" height="28" rx="3" fill="#161b22" stroke="#a371f7"/>
  <text x="110" y="533" text-anchor="middle" fill="#a371f7" font-size="9">scheduleRerender()</text>
  <text x="110" y="544" text-anchor="middle" fill="#8b949e" font-size="8">toFleet() → remount viz</text>

  <!-- Step 16: Progress event -->
  <line x1="448" y1="564" x2="282" y2="564" stroke="#58a6ff" stroke-dasharray="3,2" marker-end="url(#a)"/>
  <text x="365" y="560" text-anchor="middle" fill="#6e7681" font-size="9">hub.Emit("job", {done:1, total:N*(N-1)})</text>
  <line x1="278" y1="574" x2="112" y2="574" stroke="#a371f7" stroke-dasharray="3,2" marker-end="url(#ap)"/>
  <text x="195" y="570" text-anchor="middle" fill="#6e7681" font-size="9">SSE: job progress → status line</text>

  <!-- Step 17: Concurrent pair (same round) -->
  <rect x="370" y="594" width="180" height="16" rx="3" fill="#21262d" stroke="none"/>
  <text x="460" y="606" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="600">… concurrent pairs finish (wg.Wait barrier)</text>

  <!-- Step 18: Next round -->
  <rect x="370" y="620" width="160" height="16" rx="3" fill="#21262d" stroke="none"/>
  <text x="450" y="632" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="600">ROUND 2 … (next disjoint batch)</text>

  <!-- Retry annotation -->
  <rect x="565" y="650" width="200" height="32" rx="4" fill="#161b22" stroke="#f0883e" stroke-dasharray="3,2"/>
  <text x="665" y="664" text-anchor="middle" fill="#f0883e" font-size="9">Per-pair retry (2 attempts)</text>
  <text x="665" y="676" text-anchor="middle" fill="#8b949e" font-size="8">NATS at-most-once: retry fills matrix holes</text>

  <!-- Cancel check -->
  <rect x="395" y="694" width="110" height="16" rx="3" fill="#161b22" stroke="#f85149"/>
  <text x="450" y="706" text-anchor="middle" fill="#f85149" font-size="9">cancelled()? → abort</text>

  <!-- Step 19: All rounds done -->
  <rect x="370" y="724" width="160" height="16" rx="3" fill="#21262d" stroke="none"/>
  <text x="450" y="736" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="600">ALL ROUNDS COMPLETE</text>

  <!-- Step 20: Final SSE -->
  <line x1="448" y1="752" x2="282" y2="752" stroke="#58a6ff" stroke-dasharray="3,2" marker-end="url(#a)"/>
  <text x="365" y="748" text-anchor="middle" fill="#6e7681" font-size="9">hub.Emit("job", {status:"done"})</text>
  <line x1="278" y1="762" x2="112" y2="762" stroke="#a371f7" stroke-dasharray="3,2" marker-end="url(#ap)"/>
  <text x="195" y="758" text-anchor="middle" fill="#6e7681" font-size="9">SSE: job done</text>

  <!-- Step 21: Browser resolves -->
  <rect x="55" y="774" width="110" height="28" rx="3" fill="#161b22" stroke="#a371f7"/>
  <text x="110" y="787" text-anchor="middle" fill="#a371f7" font-size="9">resolveJobDone()</text>
  <text x="110" y="798" text-anchor="middle" fill="#8b949e" font-size="8">endRunUI() → buttons re-enable</text>

  <!-- Legend -->
  <rect x="30" y="824" width="960" height="44" rx="4" fill="#161b22" stroke="#30363d"/>
  <line x1="50" y1="846" x2="90" y2="846" stroke="#a371f7" stroke-width="2"/>
  <text x="95" y="850" fill="#8b949e" font-size="10">Browser ↔ Backend (HTTP/SSE)</text>
  <line x1="260" y1="846" x2="300" y2="846" stroke="#58a6ff" stroke-width="2"/>
  <text x="305" y="850" fill="#8b949e" font-size="10">Backend internal</text>
  <line x1="440" y1="846" x2="480" y2="846" stroke="#f0883e" stroke-width="2"/>
  <text x="485" y="850" fill="#8b949e" font-size="10">NATS bus</text>
  <line x1="580" y1="846" x2="620" y2="846" stroke="#3fb950" stroke-width="2"/>
  <text x="625" y="850" fill="#8b949e" font-size="10">Agent → NATS</text>
  <line x1="740" y1="846" x2="780" y2="846" stroke="#6e7681" stroke-width="2" stroke-dasharray="2,2"/>
  <text x="785" y="850" fill="#8b949e" font-size="10">Data-plane traffic</text>
</svg>
