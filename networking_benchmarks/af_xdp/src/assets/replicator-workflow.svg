<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 795" font-family="system-ui, -apple-system, sans-serif" font-size="11">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arr-b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="795" fill="#f8fafc" rx="8"/>

  <!-- Title -->
  <text x="470" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Replicator End-to-End Workflow</text>

  <!-- ═══ STARTUP / INIT PHASE ═══ -->
  <rect x="20" y="44" width="860" height="148" rx="6" fill="#fefce8" stroke="#facc15" stroke-dasharray="4"/>
  <text x="40" y="62" font-size="11" font-weight="bold" fill="#854d0e">STARTUP (Init.cpp · Core.cpp)</text>

  <rect x="40" y="72" width="155" height="40" rx="4" fill="#fff" stroke="#a3a3a3"/>
  <text x="117" y="89" text-anchor="middle" font-size="10" fill="#334155">CLI parse (Main.cpp)</text>
  <text x="117" y="102" text-anchor="middle" font-size="9" fill="#64748b">iface ip port [--mcast]</text>

  <line x1="195" y1="92" x2="220" y2="92" stroke="#334155" marker-end="url(#arr)"/>

  <rect x="220" y="72" width="155" height="40" rx="4" fill="#fff" stroke="#a3a3a3"/>
  <text x="297" y="89" text-anchor="middle" font-size="10" fill="#334155">setResourceLimits()</text>
  <text x="297" y="102" text-anchor="middle" font-size="9" fill="#64748b">RLIMIT_MEMLOCK=∞</text>

  <line x1="375" y1="92" x2="400" y2="92" stroke="#334155" marker-end="url(#arr)"/>

  <rect x="400" y="72" width="180" height="40" rx="4" fill="#fff" stroke="#a3a3a3"/>
  <text x="490" y="89" text-anchor="middle" font-size="10" fill="#334155">loadXdpProgram()</text>
  <text x="490" y="102" text-anchor="middle" font-size="9" fill="#64748b">ucast.o|mcast.o → DRV+ZC attach</text>

  <line x1="580" y1="92" x2="605" y2="92" stroke="#334155" marker-end="url(#arr)"/>

  <rect x="605" y="72" width="250" height="40" rx="4" fill="#fff" stroke="#a3a3a3"/>
  <text x="730" y="89" text-anchor="middle" font-size="10" fill="#334155">configureXdpProgram()</text>
  <text x="730" y="102" text-anchor="middle" font-size="9" fill="#64748b">seed config_map + free_slots_ (16 slots)</text>

  <!-- Second row -->
  <rect x="40" y="125" width="180" height="40" rx="4" fill="#fff" stroke="#a3a3a3"/>
  <text x="130" y="142" text-anchor="middle" font-size="10" fill="#334155">Per-queue XdpSocket</text>
  <text x="130" y="155" text-anchor="middle" font-size="9" fill="#64748b">setupUMem→bind→registerXskMap</text>

  <line x1="220" y1="145" x2="245" y2="145" stroke="#334155" marker-end="url(#arr)"/>

  <rect x="245" y="125" width="165" height="40" rx="4" fill="#fff" stroke="#a3a3a3"/>
  <text x="327" y="142" text-anchor="middle" font-size="10" fill="#334155">ctrl + output sockets</text>
  <text x="327" y="155" text-anchor="middle" font-size="9" fill="#64748b">port 12345 + kernel fallback</text>

  <line x1="410" y1="145" x2="435" y2="145" stroke="#334155" marker-end="url(#arr)"/>

  <rect x="435" y="125" width="175" height="40" rx="4" fill="#fff" stroke="#a3a3a3"/>
  <text x="522" y="142" text-anchor="middle" font-size="10" fill="#334155">Cache iface IP/MAC</text>
  <text x="522" y="155" text-anchor="middle" font-size="9" fill="#64748b">cached_iface_saddr_nbo_</text>

  <line x1="610" y1="145" x2="635" y2="145" stroke="#334155" marker-end="url(#arr)"/>

  <rect x="635" y="125" width="220" height="40" rx="4" fill="#fff" stroke="#a3a3a3"/>
  <text x="745" y="142" text-anchor="middle" font-size="10" fill="#334155">initializeCpuCores()</text>
  <text x="745" y="155" text-anchor="middle" font-size="9" fill="#64748b">REPLICATOR_CPUS | isolated−IRQ | fallback</text>

  <!-- ═══ THREAD SPAWN (Core.cpp::start) ═══ -->
  <rect x="20" y="200" width="860" height="60" rx="6" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="40" y="220" font-size="11" font-weight="bold" fill="#5b21b6">THREAD SPAWN (Core.cpp::start)</text>

  <rect x="40" y="230" width="272" height="22" rx="3" fill="#fff" stroke="#8b5cf6"/>
  <text x="176" y="245" text-anchor="middle" font-size="9" fill="#334155">packet_processor_thread[0..Q−1] → isolated CPU</text>

  <rect x="322" y="230" width="180" height="22" rx="3" fill="#fff" stroke="#8b5cf6"/>
  <text x="412" y="245" text-anchor="middle" font-size="10" fill="#334155">control_thread_ (port 12345)</text>

  <rect x="512" y="230" width="200" height="22" rx="3" fill="#fff" stroke="#8b5cf6"/>
  <text x="612" y="245" text-anchor="middle" font-size="10" fill="#334155">ctrl_upstream_thread_ (optional)</text>

  <rect x="722" y="230" width="138" height="22" rx="3" fill="#fff" stroke="#8b5cf6"/>
  <text x="791" y="245" text-anchor="middle" font-size="10" fill="#334155">stats (10s loop)</text>

  <!-- ═══ BUSY-POLL DATAPATH LOOP ═══ -->
  <rect x="20" y="270" width="860" height="350" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="40" y="290" font-size="11" font-weight="bold" fill="#1d4ed8">BUSY-POLL DATAPATH LOOP (DataPath.cpp · processPacketsForQueue)</text>

  <!-- RX -->
  <rect x="40" y="300" width="200" height="42" rx="4" fill="#fff" stroke="#60a5fa"/>
  <text x="140" y="318" text-anchor="middle" font-size="10" fill="#334155">XdpSocket::receive()</text>
  <text x="140" y="332" text-anchor="middle" font-size="9" fill="#64748b">peek RX ring → offsets[]/lengths[]</text>

  <line x1="240" y1="321" x2="265" y2="321" stroke="#2563eb" marker-end="url(#arr-b)"/>

  <!-- Empty path -->
  <text x="42" y="363" font-size="9" fill="#713f12" font-weight="600">empty →</text>
  <rect x="90" y="348" width="290" height="22" rx="3" fill="#fef9c3" stroke="#eab308"/>
  <text x="235" y="363" text-anchor="middle" font-size="9" fill="#713f12">__builtin_ia32_pause() + NAPI busy-poll via recvfrom</text>

  <!-- Per-frame -->
  <rect x="265" y="300" width="230" height="42" rx="4" fill="#fff" stroke="#60a5fa"/>
  <text x="380" y="318" text-anchor="middle" font-size="10" fill="#334155">Per-frame: prefetch + replicatePacket()</text>
  <text x="380" y="332" text-anchor="middle" font-size="9" fill="#64748b">batch=256(mcast) / 64(ucast)</text>

  <line x1="495" y1="321" x2="520" y2="321" stroke="#2563eb" marker-end="url(#arr-b)"/>

  <!-- RX stamp + parse -->
  <rect x="520" y="300" width="210" height="42" rx="4" fill="#fff" stroke="#60a5fa"/>
  <text x="625" y="318" text-anchor="middle" font-size="10" fill="#334155">RX stamp + extractUdpPayload()</text>
  <text x="625" y="332" text-anchor="middle" font-size="9" fill="#64748b">CLOCK_REALTIME → replicator_ns (mcast)</text>

  <line x1="730" y1="321" x2="755" y2="321" stroke="#2563eb" marker-end="url(#arr-b)"/>

  <!-- Fan-out lookup -->
  <rect x="755" y="300" width="110" height="42" rx="4" fill="#fff" stroke="#60a5fa"/>
  <text x="810" y="318" text-anchor="middle" font-size="10" fill="#334155">Fan-out set</text>
  <text x="810" y="332" text-anchor="middle" font-size="9" fill="#64748b">TL cache 100ms</text>

  <!-- Down to fan-out -->
  <line x1="450" y1="342" x2="450" y2="376" stroke="#2563eb" marker-end="url(#arr-b)"/>

  <!-- Fan-out detail box -->
  <rect x="60" y="378" width="800" height="228" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <text x="80" y="396" font-size="11" font-weight="bold" fill="#1e40af">FAN-OUT: for each of K destinations (per group)</text>

  <!-- pollTxCompletions -->
  <rect x="80" y="406" width="220" height="26" rx="3" fill="#fff" stroke="#93c5fd"/>
  <text x="190" y="423" text-anchor="middle" font-size="10" fill="#334155">pollTxCompletions() — 1× per batch</text>

  <!-- Decision -->
  <rect x="80" y="440" width="760" height="30" rx="3" fill="#f0f9ff" stroke="#7dd3fc"/>
  <text x="460" y="459" text-anchor="middle" font-size="10" fill="#0c4a6e">mac==broadcast? → sendToDestinationFallback (kernel sendto, ARP unresolved)</text>

  <!-- Three paths -->
  <rect x="80" y="478" width="230" height="50" rx="4" fill="#fee2e2" stroke="#f87171"/>
  <text x="195" y="496" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">fwd_mode=inplace &amp; last dest</text>
  <text x="195" y="510" text-anchor="middle" font-size="9" fill="#7f1d1d">patchHeadersInPlace()</text>
  <text x="195" y="522" text-anchor="middle" font-size="9" fill="#7f1d1d">→ forwardFrameInPlace(rx_addr)</text>

  <rect x="330" y="478" width="270" height="50" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="465" y="496" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">fwd_mode=copy (or other K−1)</text>
  <text x="465" y="510" text-anchor="middle" font-size="9" fill="#1e3a8a">reserveTxRing → tx_addr=(idx&amp;2047)*4096</text>
  <text x="465" y="522" text-anchor="middle" font-size="9" fill="#1e3a8a">createUdpPacket() + setTxDescriptor</text>

  <rect x="620" y="478" width="220" height="50" rx="4" fill="#ecfdf5" stroke="#34d399"/>
  <text x="730" y="496" text-anchor="middle" font-size="10" font-weight="bold" fill="#065f46">ARP-fallback (any mode)</text>
  <text x="730" y="510" text-anchor="middle" font-size="9" fill="#064e3b">sendto(output_socket_)</text>
  <text x="730" y="522" text-anchor="middle" font-size="9" fill="#064e3b">unresolved ARP / ring full</text>

  <!-- Post fan-out -->
  <rect x="80" y="540" width="330" height="26" rx="3" fill="#fff" stroke="#93c5fd"/>
  <text x="245" y="557" text-anchor="middle" font-size="10" fill="#334155">stamp replicator_tx_ns @ frame off 74 (mcast)</text>

  <rect x="430" y="540" width="200" height="26" rx="3" fill="#fff" stroke="#93c5fd"/>
  <text x="530" y="557" text-anchor="middle" font-size="10" fill="#334155">submitTxRing(1) per dest</text>

  <rect x="650" y="540" width="190" height="26" rx="3" fill="#fff" stroke="#93c5fd"/>
  <text x="745" y="557" text-anchor="middle" font-size="10" fill="#334155">requestDriverPoll() — 1×</text>

  <!-- Post-batch -->
  <rect x="80" y="575" width="250" height="26" rx="3" fill="#f0fdf4" stroke="#86efac"/>
  <text x="205" y="592" text-anchor="middle" font-size="10" fill="#14532d">Batch stats: relaxed fetch_add (packets/bytes)</text>

  <rect x="360" y="575" width="200" height="26" rx="3" fill="#f0fdf4" stroke="#86efac"/>
  <text x="460" y="592" text-anchor="middle" font-size="10" fill="#14532d">recycleFrames() → FILL ring</text>

  <!-- loop arrow -->
  <path d="M850,600 C878,600 890,440 890,300 C890,283 865,283 840,290" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5" marker-end="url(#arr-b)"/>
  <text x="900" y="450" font-size="9" fill="#2563eb" transform="rotate(-90 900 450)">loop while running_</text>

  <!-- ═══ CONTROL PLANE ═══ -->
  <rect x="20" y="630" width="860" height="60" rx="6" fill="#fdf4ff" stroke="#d946ef"/>
  <text x="40" y="650" font-size="11" font-weight="bold" fill="#86198f">CONTROL PLANE (Control.cpp · port 12345)</text>

  <rect x="40" y="658" width="120" height="22" rx="3" fill="#fff" stroke="#d946ef"/>
  <text x="100" y="673" text-anchor="middle" font-size="9" fill="#334155">ADD dest (0x01)</text>

  <rect x="170" y="658" width="130" height="22" rx="3" fill="#fff" stroke="#d946ef"/>
  <text x="235" y="673" text-anchor="middle" font-size="9" fill="#334155">REMOVE dest (0x02)</text>

  <rect x="310" y="658" width="100" height="22" rx="3" fill="#fff" stroke="#d946ef"/>
  <text x="360" y="673" text-anchor="middle" font-size="9" fill="#334155">LIST (0x03)</text>

  <rect x="420" y="658" width="150" height="22" rx="3" fill="#fff" stroke="#d946ef"/>
  <text x="495" y="673" text-anchor="middle" font-size="9" fill="#334155">MCAST_JOIN (0x04)</text>

  <rect x="580" y="658" width="150" height="22" rx="3" fill="#fff" stroke="#d946ef"/>
  <text x="655" y="673" text-anchor="middle" font-size="9" fill="#334155">MCAST_LEAVE (0x05)</text>

  <rect x="740" y="658" width="120" height="22" rx="3" fill="#fff" stroke="#d946ef"/>
  <text x="800" y="673" text-anchor="middle" font-size="9" fill="#334155">Upstream fwd</text>

  <!-- Legend -->
  <rect x="20" y="700" width="900" height="82" rx="6" fill="#fff" stroke="#e2e8f0"/>
  <text x="40" y="718" font-size="10" font-weight="bold" fill="#475569">LEGEND</text>
  <rect x="40" y="726" width="12" height="12" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="58" y="737" font-size="9" fill="#334155">In-place (zero-copy last dest)</text>
  <rect x="200" y="726" width="12" height="12" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="218" y="737" font-size="9" fill="#334155">Copy (build new TX frame per dest)</text>
  <rect x="400" y="726" width="12" height="12" fill="#ecfdf5" stroke="#34d399"/>
  <text x="418" y="737" font-size="9" fill="#334155">ARP-fallback (sendto; orthogonal to fwd_mode)</text>
  <rect x="700" y="726" width="12" height="12" fill="#fefce8" stroke="#facc15"/>
  <text x="718" y="737" font-size="9" fill="#334155">Startup / initialization (once)</text>

  <text x="40" y="754" font-size="9" fill="#9a3412" font-weight="600">Note: REPLICATOR_FWD_MODE=bpf_tx (in-kernel XDP_TX, mcast-only, 0 copies) forks at the XDP hook — it never reaches this fan-out; see datapaths.svg.</text>

  <text x="40" y="770" font-size="9" fill="#64748b">Threads: packet-processor (isolated CPU, busy-poll, never sleeps) · control (unpinned, 1s SO_RCVTIMEO) · upstream-ctrl (optional) · stats (10s sleep)</text>
</svg>
